apiVersion: v1
kind: Namespace
metadata:
  name: aics

---
apiVersion: v1
kind: Secret
metadata:
  name: aics-secret
  namespace: aics
type: Opaque
stringData:
  FEISHU_APP_ID: "CHANGE_ME"
  FEISHU_APP_SECRET: "CHANGE_ME"
  FEISHU_VERIFICATION_TOKEN: ""
  FEISHU_ENCRYPT_KEY: ""
  LLM_API_KEY: "CHANGE_ME"
  DATABASE_URL: "postgres://user:password@10.42.0.1:5432/aics?sslmode=disable"
  EMBEDDING_API_KEY: "CHANGE_ME"
  REDIS_CONN_STRING: "redis://:password@10.42.0.1:6379/0"
  IMAGE_HOST_AUTH_VALUE: "Bearer cooper"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aics-config
  namespace: aics
data:
  APP_ENV: "prod"
  HTTP_ADDR: ":8080"
  EVENT_MODE: "webhook"
  WEBHOOK_PATH: "/feishu/events"
  REACTION_RECEIVED_EMOJI: "Get"
  REACTION_PROCESSING_EMOJI: "OnIt"
  REACTION_DONE_EMOJI: "DONE"
  LOG_RAW_MESSAGE: "false"
  REPLY_FORMAT: "markdown_card"
  REPLY_MARKDOWN_MARGIN: "0px 0px 8px 0px"
  PROMPT_FILE: "configs/customer_service.md"
  LLM_BASE_URL: "https://cooper-api.com/v1"
  LLM_MODEL: "gpt-5.5"
  LLM_TIMEOUT_SECONDS: "60"
  LOG_LLM_REQUEST: "false"
  LLM_STREAM: "true"
  STREAM_PLACEHOLDER: "正在处理..."
  STREAM_UPDATE_INTERVAL_MS: "800"
  MAX_HISTORY_MESSAGES: "20"
  HISTORY_SOURCE: "feishu"
  FEISHU_HISTORY_LOOKBACK_HOURS: "168"
  MESSAGE_DEDUPE_TTL_SECONDS: "3600"
  DEDUPE_STORE: "redis"
  KNOWLEDGE_DIR: "knowledge"
  KNOWLEDGE_MODE: "auto"
  KNOWLEDGE_TOP_K: "5"
  KNOWLEDGE_CHUNK_SIZE: "900"
  KNOWLEDGE_CHUNK_OVERLAP: "120"
  EMBEDDING_BASE_URL: "https://cooper-api.com/v1beta"
  EMBEDDING_MODEL: "gemini-embedding-2"
  EMBEDDING_DIMENSIONS: "768"
  SKILLS_ENABLED: "true"
  SKILLS_DIR: "skills"
  SKILL_MAX_STEPS: "8"
  SKILL_SCRIPT_TIMEOUT_SECONDS: "30"
  IMAGE_INPUT_MODE: "base64"
  IMAGE_HOST_UPLOAD_URL: "https://2bad.lujilujilujilujiluji.com/"
  IMAGE_HOST_AUTH_HEADER: "Authorization"
  IMAGE_HOST_FIELD_NAME: "file"
  IMAGE_HOST_RESPONSE_URL_PATH: "url"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aics-deployment
  namespace: aics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aics
  template:
    metadata:
      labels:
        app: aics
    spec:
      initContainers:
        - name: init-aics-data
          image: busybox:1.36
          command:
            - sh
            - -c
            - mkdir -p /data/configs /data/skills
          volumeMounts:
            - name: aics-data
              mountPath: /data
      containers:
        - name: aics
          image: ghcr.io/ustoolscn/aics:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: aics-config
            - secretRef:
                name: aics-secret
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: aics-data
              mountPath: /app/configs
              subPath: configs
            - name: aics-data
              mountPath: /app/skills
              subPath: skills
      volumes:
        - name: aics-data
          hostPath:
            path: /root/aics/data/
            type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:
  name: aics-service
  namespace: aics
spec:
  selector:
    app: aics
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aics-ingress
  namespace: aics
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: aics.cooper-api.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aics-service
                port:
                  number: 8080
